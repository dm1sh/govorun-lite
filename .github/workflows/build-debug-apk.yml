name: Build debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The native runtime is intentionally gitignored because it is a large AAR.
      - name: Download sherpa-onnx runtime
        run: ./scripts/download-sherpa-onnx.sh

      # The model is also gitignored, but is required for a usable APK.
      - name: Download GigaAM model
        run: ./scripts/download-model.sh

      - name: Build debug APK
        # Run number is monotonic; the attempt component also makes a
        # manually re-run workflow produce a newer installable APK.
        run: |
          VERSION_CODE=$((19 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          ./gradlew --no-daemon assembleDebug -PversionCode="$VERSION_CODE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: govorun-lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
